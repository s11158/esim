name: Sync Saily and Airalo prices

# Цены провайдеров меняются молча: у Airalo по Грузии тариф 10 ГБ / 30 дней
# просто исчез, а на сайте он висел по старой цене. Раз в сутки переснимаем
# цены с их страниц, чтобы каталог не устаревал сам по себе.
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pull prices from Saily and Airalo
        run: node scripts/update-prices.mjs

      - name: Commit if prices changed
        run: |
          if git diff --quiet -- index.html; then
            echo "Цены не изменились — коммита нет."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Sync Saily and Airalo prices from provider pages"
          git push
