name: Track competitor benchmark

# Цены eSIM.dog - наш ориентир по всей ценовой стратегии, и они меняются
# без предупреждения. Раз в сутки складываем их таблицу в data/, чтобы видеть
# реальный разрыв на сегодня, а не на день последней ручной проверки.
on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch benchmark
        run: node scripts/fetch-benchmark.mjs

      - name: Dump competitor market
        run: node scripts/fetch-competitors.mjs

      # Карта рынка по прямым фидам провайдеров. Отдельно от дампа агрегатора:
      # тот показывает, кто вообще есть на направлении, а эта таблица - по каким
      # ценам мы реально можем продавать и где у нас нет партнёра.
      - name: Build market map
        run: node scripts/build-market.mjs

      # Оптовый каталог Stellar - закупочные цены. В публичный репозиторий они не попадают:
      # скрипт пишет в data/*.local.* (эти маски в .gitignore), результат уходит только
      # приватным артефактом workflow. Шаг не роняет весь прогон, если API недоступен.
      - name: Fetch Stellar wholesale catalogue
        continue-on-error: true
        env:
          STELLAR_WHOLESALE_KEY: ${{ secrets.STELLAR_WHOLESALE_KEY }}
          STELLAR_WHOLESALE_BASE: ${{ secrets.STELLAR_WHOLESALE_BASE }}
        run: node scripts/fetch-stellar-wholesale.mjs

      - name: Upload Stellar wholesale as private artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: stellar-wholesale
          retention-days: 90
          if-no-files-found: warn
          path: |
            data/stellar-wholesale.local.csv
            data/stellar-wholesale.local.json

      # Сверка наших витринных цен с эталонами (eSIM.dog и eSIMDB). Пишет
      # data/price-gap-report.md и data/price-gap-critical.txt. Перед запуском
      # запоминаем прошлый список критичных разрывов, чтобы алертить только на новые.
      - name: Build price gap report
        continue-on-error: true
        run: |
          cp data/price-gap-critical.txt /tmp/prev-critical.txt 2>/dev/null || touch /tmp/prev-critical.txt
          node scripts/price-gap-alert.mjs

      # Алерт: если появились критичные разрывы (больше 3x), которых не было в прошлом
      # прогоне, создаём или обновляем issue "Price gap alert". Дубли не плодим:
      # ищем открытый issue с этим заголовком и добавляем комментарий.
      - name: Alert on new critical gaps
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f data/price-gap-critical.txt ] || exit 0
          NEW=$(grep -Fxv -f /tmp/prev-critical.txt data/price-gap-critical.txt || true)
          if [ -z "$NEW" ]; then
            echo "Новых критичных разрывов нет - алерт не нужен."
            exit 0
          fi
          BODY=$(printf 'Новые критичные разрывы (больше 3x) за %s:\n\n```\n%s\n```\n\nПолный отчёт: data/price-gap-report.md\n\n%s' \
            "$(date -u +%F)" "$NEW" "$(head -n 5 data/price-gap-report.md)")
          NUM=$(gh issue list --state open --search 'in:title "Price gap alert"' --json number,title \
            --jq '.[] | select(.title == "Price gap alert") | .number' | head -n 1)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "Price gap alert" --body "$BODY"
          fi

      # Гарантия низкой цены esim.free: сверяем публичный каталог витрины с розницей
      # из карты рынка. Ценовая дыра (чужой тариф не больше нашего по объёму и сроку,
      # но дешевле) - нарушение обещания, о новых дырах заводим или дополняем issue.
      - name: Audit esim.free price guarantee
        continue-on-error: true
        run: |
          cp data/esim-free-guarantee-holes.txt /tmp/prev-holes.txt 2>/dev/null || touch /tmp/prev-holes.txt
          node scripts/esim-free-guarantee.mjs

      - name: Alert on new price holes in the esim.free guarantee
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f data/esim-free-guarantee-holes.txt ] || exit 0
          NEW=$(grep -Fxv -f /tmp/prev-holes.txt data/esim-free-guarantee-holes.txt || true)
          if [ -z "$NEW" ]; then
            echo "Новых ценовых дыр в гарантии esim.free нет - алерт не нужен."
            exit 0
          fi
          BODY=$(printf 'Новые ценовые дыры в гарантии низкой цены esim.free за %s:\n\n```\n%s\n```\n\nПолный отчёт: data/esim-free-guarantee.md' \
            "$(date -u +%F)" "$NEW")
          NUM=$(gh issue list --state open --search 'in:title "esim.free price guarantee"' --json number,title \
            --jq '.[] | select(.title == "esim.free price guarantee") | .number' | head -n 1)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "esim.free price guarantee" --body "$BODY"
          fi

      - name: Commit if prices moved
        run: |
          if git diff --quiet -- data/; then
            echo "Цены конкурента не изменились - коммита нет."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Track eSIM.dog benchmark prices"
          git push
